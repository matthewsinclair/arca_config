# arca_config -- devbin configuration.
#
# Written by devbin install, filled in by ST0002 WP-02. Every key, annotated,
# is vendored beside this file at bin/.devbin/lib/config.reference.yaml.
#
# Every entry below is DERIVED from the launcher this replaces -- the three
# scripts under scripts/ -- via the inventory at
# intent/st/ST0002/WP/02/arca_config-inventory.md in the Devbin repo. Where the
# catalogue default already matches, there is deliberately NO entry here:
# config carries the differences, not a second copy of the catalogue.

project:
  name: arca_config
  alias: ac

  # Gate scope, not project composition. Intent declares [shell, elixir] and
  # that is right for critics; the only shell in this tree is Intent's own hook
  # scripts and the scripts/ launcher being retired, neither of which has a
  # devbin gate to run.
  languages:
    - elixir

  # mix.exs is the one version home -- no VERSION file, no sidecars.
  version_from: mix.exs

# The devbin this project expects. Enforced by: devbin doctor
devbin_version: "^0.1.0"

help:
  tagline: "dev launcher for arca_config -- the configuration library the Arca tools share"

# `docs treeindex` was REMOVED from devbin on 2026-08-25 (devbin#0032), and the
# docs.treeindex_dirs key that fed it went with it. Intent v3 retires `intent
# treeindex` with no replacement (executed at intent 861fa66c), so the option
# was a catalogue row that lists cleanly, resolves cleanly and can never succeed
# once this estate moves. The key is not merely unread now: the schema no longer
# knows it, so leaving it here fails `devbin doctor` for a setting nothing uses.
# This note is deliberate -- a removal nothing records is a removal that comes
# back the next time someone wonders why the docs block is thin.

commands:
  server:
    # No Phoenix and nothing to serve.
    enabled: false

  repl:
    # The builtin runs `mix <name>.cli repl`; this project's CLI task has no
    # repl subcommand, and scripts/ never had one either (arca_cli does).
    enabled: false

  db:
    # No Ecto, no repo, no database.
    enabled: false

  build:
    # A library: `mix compile` is the build, and `check compile` already gates
    # it under --warnings-as-errors. A second name for the same work is the
    # Highlander breach.
    enabled: false

  cli:
    # scripts/cli. The builtin runs `mix <DEVBIN_NAME>.cli`, which here would be
    # `mix arca_config.cli` -- this project's task is `arca.config`, declared via
    # mix_tasks: in mix.exs and implemented at lib/mix/tasks/arca_config.ex.
    #
    # No .env preamble: config/dotenv.exs already loads config/.env during mix
    # configuration evaluation, on every dev and test invocation, with
    # defaults-not-overrides precedence and tolerance for a missing file. The
    # shell-level loading in all three retired scripts was redundant with it.
    #
    # `scripts/iex` does NOT fold in here. It was recorded that way first --
    # "this command in IEx, via the framework's `--iex` (D20)" -- on the strength
    # of `mix Arca.Config` and `mix arca.config` resolving to the same module.
    # They do, and that was the wrong half to check. `--iex` is read by exactly
    # one thing in devbin, the builtin `server` handler, which is disabled here;
    # for a declared `run:` nothing reads it at all, so `bin/ac cli --iex` is
    # parsed, exported and ignored. Proven with a poisoned `iex` first on PATH:
    # never fired for `cli --iex`, fired immediately for `bin/ac iex`.
    #
    # What replaced scripts/iex is the builtin `iex` command (`iex -S mix`),
    # which is offered and live. See bin/.devbin/help/iex.md for the delta, and
    # Devbin issue 0009 for why the flag is offered where nothing can read it.
    run: mix arca.config

  # `check toolchain` is LIVE, like every other project in both fleets. There is
  # deliberately no entry for it.
  #
  # It was `enabled: false` for a few hours on 2026-08-10, reasoned as "the CI
  # matrix is already the home for this fact, so a pin file would be a second
  # one". That reasoning was wrong twice over, and hv reversed it the same day.
  #
  # Wrong on the facts: the matrix's own top cell said 1.20.2 while every local
  # run used 1.20.3, so the fact it supposedly owned had already drifted and
  # nothing was watching. Wrong on the policy: hv's standing rule, written into
  # Baize's .tool-versions on 2026-07-28, is "run the latest, and keep this file
  # matching what you actually run" -- fleet-wide, not per-project.
  #
  # The two are different facts and now have one home each: .tool-versions is
  # the version this library is DEVELOPED on, the matrix's lower cells are the
  # older pairs it still SUPPORTS, and CI hard-fails if the top cell drifts from
  # the pin file.

  test:
    options:
      mix:
        # scripts/test ran `mix test --trace`. CI runs `mix test
        # --warnings-as-errors`, and CI's comment says why: plain `mix compile`
        # only compiles lib/, so warnings in test/ went unreported. The
        # catalogue's bare `mix test` would make this gate check LESS than the
        # gate beside it, which is the failure mode that passes every
        # comparison you would think to make.
        #
        # --trace is output verbosity rather than strictness, and devbin passes
        # trailing argv through, so `bin/ac test mix --trace` still works.
        summary: ExUnit, at CI's strictness
        run: mix test --warnings-as-errors
        grammar: mix
        log: MIX

  docs:
    options:
      exdoc:
        # A published library, so the API docs ARE a deliverable. ex_doc is
        # already a dev dependency and nothing was driving it.
        summary: "Build the API documentation with ex_doc"
        run: mix docs
        grammar: generic
        log: EXDOC
        in_all: false
